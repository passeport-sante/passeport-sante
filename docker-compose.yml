version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: prevention_db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-prevention_db}
      POSTGRES_USER: ${DATABASE_USER:-dev}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prevention-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: prevention_backend
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-dev}:${DATABASE_PASSWORD:-dev123}@postgres:5432/${DATABASE_NAME:-prevention_db}
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NODE_PATH: /app/apps/backend/node_modules
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      TSC_WATCHFILE: "DynamicPriorityPolling"
    ports:
      - "5000:5000"
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prevention-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    container_name: prevention_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      API_INTERNAL_URL: http://backend:5000
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
    depends_on:
      - backend
    networks:
      - prevention-network

  adminer:
    image: adminer:latest
    container_name: prevention_adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prevention-network

volumes:
  postgres_data:
    driver: local

networks:
  prevention-network:
    driver: bridge
